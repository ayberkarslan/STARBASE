name = "starbase"
workers_dev = true
main = "src/index.ts"
compatibility_date = "2026-10-01"
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[[routes]]
pattern = "starbase.ayberkarslan.com"
custom_domain = true
[[d1_databases]]
binding = "DB"
database_name = "starbase"
database_id = "fd474bbf-cfca-42c6-91e6-e2fc7a1d264d"
migrations_dir = "migrations"
[vars]
PUBLIC_ORIGIN = "https://starbase.ayberkarslan.com"
FIREBASE_PROJECT_ID = "starbase-3ce1f"
FIREBASE_API_KEY = "AIzaSyBs6-4Ffur8Z5oWJcT9WF_jU7mBf65dE_s"
TURNSTILE_SITE_KEY = "0x4AAAAAAFz1CdINYgcD0Umi"
LATEX_COMPILER_ORIGIN = "https://yrt-latex-compiler-777919223466.europe-west1.run.app"

[triggers]
crons = ["0 3 * * *"]

[durable_objects]
bindings = [{name = "BOARD_HUB", class_name = "BoardHub"}, {name = "SHARE_ROOM", class_name = "ShareRoom"}]
[[migrations]]
tag = "v1-board-hub"
new_sqlite_classes = ["BoardHub"]
[[migrations]]
tag = "v2-share-room"
new_sqlite_classes = ["ShareRoom"]
